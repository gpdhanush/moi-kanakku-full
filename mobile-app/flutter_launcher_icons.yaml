# dart run flutter_launcher_icons
# Android-only project — no ios/web/windows/macos folders.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app-logo/light-logo.png"
  adaptive_icon_background: "#087F5B"
  adaptive_icon_foreground: "assets/app-logo/app-logo-light.png"
  adaptive_icon_monochrome: "assets/app-logo/notification-logo.png"
  min_sdk_android: 21
