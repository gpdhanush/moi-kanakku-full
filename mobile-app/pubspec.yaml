name: moi
description: "A new Flutter project."
publish_to: "none"

version: 5.2.1+55 # ANDROID PLAY STORE VERSION

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  speech_to_text: ^7.5.0
  upgrader: ^13.7.0
  intl: ^0.20.2
  local_auth: ^3.0.0
  path_provider: ^2.1.5
  flutter_exit_app: ^2.1.2
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.0.0
  permission_handler: ^13.0.2
  path: ^1.9.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  in_app_review: ^2.0.12
  dio: ^5.8.0+1
  crypto: ^3.0.6
  asn1lib: ^1.6.5
  flutter_easyloading: ^4.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.5.1
  image_cropper: ^12.2.1
  flutter_file_downloader: ^2.1.1
  google_sign_in: ^6.2.1
  # FIREBASE PLUGINS
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  check_disposable_email: ^0.2.1
  pdf: ^3.13.0
  printing: ^5.15.0
  open_file: ^4.0.0
  device_info_plus: ^13.2.0
  screenshot: ^3.0.0
  tamil_pdf_shaper: ^1.0.4
  hugeicons: ^1.1.7
  custom_refresh_indicator: ^4.0.2
  go_router: ^15.1.2
  flutter_animate: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app-logo/light-logo.png"
  adaptive_icon_background: "#087F5B"
  adaptive_icon_foreground: "assets/app-logo/light-logo.png"
  adaptive_icon_monochrome: "assets/app-logo/notification-logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Needed for PDF rootBundle.load (also registered as NotoSansTamil below).
  assets:
    - assets/
    - assets/images/
    - assets/images/empty-state/
    - assets/images/maintainence/
    - assets/images/splash/
    - assets/images/home_page/
    - assets/logo/
    - assets/app-logo/
    - assets/svg/
    - assets/translations/
    - assets/fonts/NotoSansTamil-Regular.ttf
    - assets/fonts/Caveat/
    - assets/fonts/EmptyHead/EduQLDHand-Medium.ttf

  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    # Alias for older Inter references — maps to bundled Arimo.
    - family: Inter
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf

    - family: BonheurRoyale
      fonts:
        - asset: assets/fonts/BonheurRoyale-Regular.ttf

    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka/Fredoka-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fredoka/Fredoka-Light.ttf
          weight: 300

    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat/Caveat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Caveat/Caveat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Caveat/Caveat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Caveat/Caveat-Bold.ttf
          weight: 700

    - family: EduQLDHand
      fonts:
        - asset: assets/fonts/EmptyHead/EduQLDHand-Medium.ttf
          weight: 500