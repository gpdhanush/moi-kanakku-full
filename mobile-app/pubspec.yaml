name: moi
description: "A new Flutter project."
publish_to: "none"

version: 5.0.1+52 # ANDROID PLAY STORE VERSION

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  speech_to_text: ^7.4.0
  fluttertoast: ^10.0.0
  upgrader: ^13.7.0
  intl: ^0.20.2
  local_auth: ^3.0.0
  path_provider: ^2.1.5
  flutter_exit_app: ^2.1.2
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.0.0
  permission_handler: ^13.0.2
  path: ^1.9.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.0.0
  in_app_review: ^2.0.12
  dio: ^5.8.0+1
  crypto: ^3.0.6
  asn1lib: ^1.6.5
  flutter_easyloading: ^3.0.5
  adaptive_action_sheet: ^2.0.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.5.1
  image_cropper: ^12.2.1
  flutter_file_downloader: ^2.1.1
  # razorpay_flutter: ^1.3.7
  webview_flutter: ^4.10.0
  # FIREBASE PLUGINS
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^19.5.0
  check_disposable_email: ^0.2.1
  pdf: ^3.11.1
  printing: ^5.13.3
  open_file: ^4.0.0
  device_info_plus: ^13.2.0
  screenshot: ^3.0.0
  # share_plus: ^12.0.1
  tamil_pdf_shaper: ^1.0.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/translations/
    - assets/fonts/NotoSansTamil-Regular.ttf

  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf

    - family: AzeretMono
      fonts:
        - asset: assets/fonts/AzeretMono/AzeretMono-Variable.ttf

    # Compatibility aliases used by existing widgets.
    - family: appFontFamily
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: RobotoBold
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: ProximaNova
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: tamilFont
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700
    
    - family: englishFont
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700

    - family: amountFont
      fonts:
        - asset: assets/fonts/AzeretMono/AzeretMono-Variable.ttf


